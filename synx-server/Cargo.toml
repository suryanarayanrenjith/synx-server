[package]
name = "synx-server"
version = "1.0.0"
edition = "2021"
description = "SYNX multiplayer server: lobbies, an authoritative race director and a physics-envelope validator."
default-run = "synx-server"

[dependencies]
# Shared binary wire protocol.
synx-net = { path = "../protocol" }

# HTTP and WebSocket server.
axum = { version = "0.8", features = ["ws", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"] }
tower-http = { version = "0.6", features = ["cors", "trace", "limit", "timeout"] }
# Async WebSocket stream utilities.
futures-util = { version = "0.3", default-features = false, features = ["sink"] }

# Structured logging.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "time"] }

# Lobby control messages.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Session token signing and encoding.
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
base64 = "0.22"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
