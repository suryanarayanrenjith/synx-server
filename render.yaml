# Render deployment for a SYNX grid.
#
# This file is an example, not a requirement. The server needs no configuration
# to run: `cargo run --release` gives you a working grid on port 10000, and the
# Dockerfile beside this file builds the same thing anywhere a container runs.
# Everything below is either something the host insists on choosing, or a
# preference about logging.
#
# If you are deploying somewhere else - Fly, Railway, a box under a desk - the
# only thing you have to honour is PORT.
services:
  - type: web
    name: synx-multiplayer
    runtime: docker
    plan: free
    region: singapore
    rootDir: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # PORT is injected by Render, and the server obeys it. That is the whole
      # of the required configuration.

      # WHO MAY CONNECT.
      #
      # Unset, the server accepts the origins a SYNX desktop build presents,
      # which is what the shipped game needs and nothing more. Set it if you
      # serve the web build from your own domain - that domain has to be named
      # here or the browser's own Origin header will get it turned away.
      #
      # This check is decisive against a web page and worth nothing against a
      # native process, which can send any header it likes. That is fine and
      # intended: it exists to stop another SITE quietly using your server as
      # free infrastructure, not to establish who wrote the client. See
      # src/client.rs for the honest version of that argument.
      - key: SYNX_ALLOWED_ORIGINS
        value: tauri://localhost,http://tauri.localhost,https://tauri.localhost

      # A container reports the host's whole CPU count, so the tokio default
      # would spawn eight workers to share a fraction of a core.
      - key: SYNX_WORKERS
        value: "2"

      - key: RUST_LOG
        value: info,synx_server=debug
      - key: RUST_BACKTRACE
        value: "1"
