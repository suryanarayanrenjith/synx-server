# SYNX multiplayer server workspace.
#
# The shared protocol is compiled by both the game and server.
[workspace]
resolver = "2"
members = ["protocol", "synx-server"]

# Optimize the release binary for deployment.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# Keep panics isolated to their tasks where possible.
panic = "unwind"
strip = true
